# This repo had no CI at all before this file - not a stale workflow, none.
# Everything below therefore runs for the first time here rather than replacing
# an inherited pipeline; upstream ToroCraft/ToroHealth's per-version branches
# each carry their own single-version build, none of which applies to this
# fork's Stonecutter matrix.

name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build matrix + unit/loaded tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Java 21 is the floor. Cells whose Minecraft needs a newer JDK (26.x
      # needs 25) auto-provision it through the foojay resolver declared in
      # settings.gradle.kts. Do not add a second setup-java for 25; that would
      # defeat the toolchain.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # chiseledBuild builds all ten cells AND runs each cell's `check`: the
      # unit suite, the Tier 1 loaded-game test on the five Fabric cells, and
      # the JaCoCo 100% line-coverage gate.
      - name: Build all versions and loaders
        run: ./gradlew chiseledBuild

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: |
            versions/*/build/reports/tests/**
            versions/*/build/test-results/**
            versions/*/build/reports/jacoco/**
          retention-days: 14
          if-no-files-found: warn

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: torohealth-jars-${{ github.sha }}
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar
          retention-days: 14

  client-gametest:
    name: Tier 3 client gametest (headless)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Only the cells whose Fabric API bundle ships
        # fabric-client-gametest-api-v1 (first appears around fabric-api 0.106 /
        # MC 1.21.2) - see build.gradle.kts, `clientGameTestSupported`. The
        # NeoForge and Forge cells have no equivalent reachable from
        # Architectury Loom.
        cell: ['1.21.4-fabric', '26.2-fabric']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # A real Minecraft client really launches here: real window, real GL
      # context, real render thread. The runner has no display and no GPU.
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers \
            libxi6 libxxf86vm1 libxrandr2 libxcursor1 libxinerama1 libxext6

      - name: Run client gametest (${{ matrix.cell }})
        env:
          # Force llvmpipe. Without this LWJGL can pick up a partial hardware GL
          # stack on the runner and fail at context creation rather than falling
          # back to software.
          LIBGL_ALWAYS_SOFTWARE: 'true'
          MESA_GL_VERSION_OVERRIDE: '3.3'
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            ./gradlew :${{ matrix.cell }}:runClientGameTest --stacktrace

      # The screenshots are the evidence that the HUD actually drew, so keep
      # them whether the run passed or failed - the failure one is more useful.
      - name: Upload gametest screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-gametest-${{ matrix.cell }}-${{ github.sha }}
          path: |
            versions/${{ matrix.cell }}/build/run/clientGameTest/screenshots/**
            versions/${{ matrix.cell }}/build/run/clientGameTest/logs/**
          retention-days: 14
          if-no-files-found: warn
